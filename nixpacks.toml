[phases.install]
# --include=dev is not optional here. Railway sets npm's legacy `production`
# config, which makes `npm ci` omit devDependencies — and the build needs
# several of them: vite, @vitejs/plugin-react, @tailwindcss/vite and
# vite-imagetools for the client and prerender builds, typescript and the
# @types packages for type checking.
cmds = ["npm ci --include=dev"]

[phases.build]
# Client build, SSR build, then every route prerendered to dist/client.
cmds = ["npm run build"]

[start]
# Express serves dist/client and the API, listening on $PORT.
cmd = "npm start"
